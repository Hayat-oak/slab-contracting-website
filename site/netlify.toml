# Netlify configuration for the SLAB site. Publish directory = this folder (site/).
[build]
  publish = "."

# Development-only files are not needed in production; they are harmless but can be excluded from the upload.
# (qa/, verify_site.cjs, extract_assets.py, build_release.py, README_AR.txt)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    # Inline style attributes are used for background images; scripts are same-origin only.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://oydrudnqcazzytauodup.supabase.co; font-src 'self'; connect-src 'self' https://oydrudnqcazzytauodup.supabase.co https://formsubmit.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
